[build]
command = "npm run build"
publish = "dist"
[build.environment]
NODE_VERSION = "22"
[functions]
directory = "netlify/functions"
node_bundler = "esbuild"
[[headers]]
for = "/admin/*"
[headers.values]
Cache-Control = "no-cache"
X-Robots-Tag = "noindex, nofollow"
[[redirects]]
from = "/search"
to = "/#journal"
status = 301
[[redirects]]
from = "/starters"
to = "/about/"
status = 301
[[redirects]]
from = "/success"
to = "/contact/"
status = 301
